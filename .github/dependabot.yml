version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The legacy images build ancient libtorrent (1.1.x/1.2.x) that only
      # compiles against the Boost/GCC in Ubuntu 24.04 LTS; newer Ubuntu
      # releases removed Boost.Asio APIs these versions depend on. Pin to
      # 24.04 and only accept patch-level updates.
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit:
        patterns:
          - "*"

  # locked dependencies for the "Verify image" CI step
  - package-ecosystem: "uv"
    directory: "/.github/verify"
    schedule:
      interval: "weekly"
