name: Publish All Images

########################################################
#
# Builds all qBittorrent images
#
########################################################

on:
  schedule:
    - cron: "36 6 2 */3 *"
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel an in-progress publish on main; only superseded PR runs
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: rmartin16

jobs:

  # Decide which image families need building. Scheduled and manual runs build
  # everything; pushes and PRs only build families whose inputs changed. PRs
  # never publish, so they build a representative sample instead of everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      modern: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.modern == 'true' || (github.event_name == 'pull_request' && steps.filter.outputs.verify == 'true') }}
      legacy: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.legacy == 'true' || (github.event_name == 'pull_request' && steps.filter.outputs.verify == 'true') }}
      sample: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout repository
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed image inputs
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            modern:
              - "All.Dockerfile"
              - "qBittorrent.Dockerfile"
              - "scripts/install_libtorrent.sh"
              - "scripts/install_qbittorrent.sh"
              - "patches/**"
              - "assets/**"
              - ".github/workflows/docker-publish-all.yml"
              - ".github/workflows/docker-publish-dev.yml"
              - ".github/workflows/docker-publish-release.yml"
              - ".github/workflows/build-images.yml"
              - ".github/workflows/libtorrent-latest-versions.yml"
            legacy:
              - "All.Legacy.Dockerfile"
              - "qBittorrent.Legacy.Dockerfile"
              - "scripts/*_legacy*"
              - "patches/**"
              - "assets/**"
              - ".github/workflows/docker-publish-all.yml"
              - ".github/workflows/docker-publish-legacy.yml"
              - ".github/workflows/libtorrent-latest-versions.yml"
            # only affects the verify step, so it's tested on PRs but doesn't
            # warrant republishing every image
            verify:
              - ".github/verify/**"

  libtorrent-versions:
    uses: ./.github/workflows/libtorrent-latest-versions.yml

  build-base:
    runs-on: ubuntu-latest
    needs: [ changes, libtorrent-versions ]
    if: needs.changes.outputs.modern == 'true'
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - LIBTORRENT_VERSION: ${{ needs.libtorrent-versions.outputs.libtorrent-v2_1-version }}
            LIBTORRENT_TAG: v2_1
          - LIBTORRENT_VERSION: ${{ needs.libtorrent-versions.outputs.libtorrent-v2-version }}
            LIBTORRENT_TAG: v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/qbittorrent-base
          flavor: latest=false
          labels: |
            maintainer=${{ github.repository_owner }}
            org.opencontainers.image.title=qbittorrent v4.3.0 libtorrent ${{ matrix.LIBTORRENT_VERSION }} builder
            org.opencontainers.image.description=Base to build qBittorrent 4.3.0+ using libtorrent ${{ matrix.LIBTORRENT_VERSION }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
          tags: |
            type=raw,value=libtorrent-${{ matrix.LIBTORRENT_TAG }}
            type=raw,value=latest,enable=${{ matrix.LIBTORRENT_TAG == 'v2' }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: All.Dockerfile
          target: qbittorrent-base
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.LIBTORRENT_TAG }}
          cache-to: type=gha,mode=max,scope=${{ matrix.LIBTORRENT_TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: LIBTORRENT_VERSION=${{ matrix.LIBTORRENT_VERSION }}

  build-legacy-base:
    runs-on: ubuntu-latest
    needs: [ changes, libtorrent-versions ]
    if: needs.changes.outputs.legacy == 'true'
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - LIBTORRENT_VERSION: 1_1_14
            LIBTORRENT_TAG: 1_1_14
          - LIBTORRENT_VERSION: ${{ needs.libtorrent-versions.outputs.libtorrent-v1-version }}
            LIBTORRENT_TAG: v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/qbittorrent-base
          flavor: latest=false
          labels: |
            maintainer=${{ github.repository_owner }}
            org.opencontainers.image.title=qbittorrent v4.3.0 libtorrent ${{ matrix.LIBTORRENT_VERSION }} builder
            org.opencontainers.image.description=Base to build qBittorrent 4.3.0+ using libtorrent ${{ matrix.LIBTORRENT_VERSION }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
          tags: |
            type=raw,value=legacy-libtorrent-${{ matrix.LIBTORRENT_TAG }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: All.Legacy.Dockerfile
          target: qbittorrent-base
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.LIBTORRENT_TAG }}-legacy
          cache-to: type=gha,mode=max,scope=${{ matrix.LIBTORRENT_TAG }}-legacy
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: LIBTORRENT_VERSION=${{ matrix.LIBTORRENT_VERSION }}

  build-qbittorrent-dev:
    needs: [ changes, build-base ]
    uses: ./.github/workflows/docker-publish-dev.yml
    with:
      sample: ${{ needs.changes.outputs.sample == 'true' }}

  build-qbittorrent-release:
    needs: [ changes, build-base ]
    uses: ./.github/workflows/docker-publish-release.yml
    with:
      sample: ${{ needs.changes.outputs.sample == 'true' }}

  build-qbittorrent-legacy:
    needs: [ changes, build-legacy-base ]
    uses: ./.github/workflows/docker-publish-legacy.yml
    with:
      sample: ${{ needs.changes.outputs.sample == 'true' }}
