name: Publish Release Images

########################################################
#
# Builds qBittorrent v4.3.0+
#
########################################################

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sample:
        description: "Build a representative sample (release builds only) instead of every version"
        required: false
        default: false
        type: boolean

jobs:

  libtorrent-versions:
    uses: ./.github/workflows/libtorrent-latest-versions.yml

  qbittorrent-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      qbittorrent-versions: ${{ steps.set-qbittorrent-versions.outputs.qbittorrent-versions }}
      qbittorrent-latest-version: ${{ steps.set-qbittorrent-versions.outputs.qbittorrent-latest-version }}

    steps:
      - name: Declare qBittorrent Versions
        id: set-qbittorrent-versions
        run: |  # find all releases >= v4.3.0
          ALL_VERS=$( \
            git -c 'versionsort.suffix=-' ls-remote --tags --sort='v:refname' https://github.com/qbittorrent/qBittorrent.git | \
            cut --delimiter='/' --fields=3 | \
            grep -v "\^{}" | \
            cut --delimiter='-' --fields=2 | \
            grep -E '^4\.[3-9]\.\d*.|^[5-9]\.\d*.\.\d*.' \
          )

          FINAL_VERSION_VERS=$( \
            git -c 'versionsort.suffix=-' ls-remote --tags --sort='v:refname' https://github.com/qbittorrent/qBittorrent.git | \
            grep -vE 'alpha|beta|rc' | \
            cut --delimiter='/' --fields=3 | \
            grep -v "\^{}" | \
            cut --delimiter='-' --fields=2 | \
            grep -E '^4\.[3-9]\.\d*.|^[5-9]\.\d*.\.\d*.' \
          )

          LATEST_VER=$(echo ${FINAL_VERSION_VERS} | rev | cut -d' ' -f1 | rev)
          echo "Latest: ${LATEST_VER}"
          echo "qbittorrent-latest-version=${LATEST_VER}" >> ${GITHUB_OUTPUT}

          if [ "${{ inputs.sample }}" = "true" ]; then
            # one release per code path: oldest (Qt5), first Qt6, last on
            # libtorrent 2.0, first on libtorrent 2.1, and the latest
            ALL_VERS=$( \
              printf '%s\n' ${FINAL_VERSION_VERS} | head -n1; \
              printf '%s\n' ${FINAL_VERSION_VERS} | grep '^4\.4\.' | head -n1; \
              printf '%s\n' ${FINAL_VERSION_VERS} | grep -E '^4\.|^5\.[0-2]\.' | tail -n1; \
              printf '%s\n' ${FINAL_VERSION_VERS} | grep '^5\.3\.' | head -n1; \
              echo "${LATEST_VER}" \
            )
            ALL_VERS=$(printf '%s\n' ${ALL_VERS} | sort -uV)
          fi

          VERS_MATRIX_LIST=$(echo ${ALL_VERS} | sed -z 's/ /","/g;s/,$/\n/')
          VERS_MATRIX_LIST="[\"${VERS_MATRIX_LIST}\"]"
          echo ${VERS_MATRIX_LIST}
          echo "qbittorrent-versions=${VERS_MATRIX_LIST}" >> ${GITHUB_OUTPUT}

  build:
    needs: [ qbittorrent-versions, libtorrent-versions ]
    permissions:
      contents: read
      packages: write
    secrets: inherit
    uses: ./.github/workflows/build-images.yml
    with:
      qbittorrent-versions: ${{ needs.qbittorrent-versions.outputs.qbittorrent-versions }}
      qbittorrent-latest-version: ${{ needs.qbittorrent-versions.outputs.qbittorrent-latest-version }}
      build-types: ${{ inputs.sample && '["release"]' || '["release", "debug"]' }}
      version-style: release
      libtorrent-v2-version: ${{ needs.libtorrent-versions.outputs.libtorrent-v2-version }}
      libtorrent-v2_1-version: ${{ needs.libtorrent-versions.outputs.libtorrent-v2_1-version }}
